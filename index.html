<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Practice with Killian</title>
<meta name="theme-color" content="#1d6fd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Killian">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Concepto: un cuaderno-juego de cielo azul con nubes, un búho graduado como guía y botones amarillos grandes. */
:root{
  --sky:#dff2ff;      /* celeste de fondo */
  --sky-2:#bfe3fb;    /* celeste medio */
  --blue:#1d6fd8;     /* azul principal */
  --blue-d:#0f4aa3;   /* azul profundo */
  --ink:#12306b;      /* texto */
  --sun:#ffc928;      /* amarillo botón */
  --sun-d:#e0a400;
  --white:#ffffff;
  --ok:#17894b; --ok-bg:#e5f7ec;
  --bad:#c8432b; --bad-bg:#fff0ec;
  --skip:#6b7a99; --skip-bg:#eef2f9;
  --font-display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--font-body); font-weight:700; font-size:1.125rem; line-height:1.5;
  color:var(--ink); background-color:var(--sky);
  background-image:
    radial-gradient(ellipse 160px 60px at 12% 9%, rgba(255,255,255,.9) 60%, transparent 62%),
    radial-gradient(ellipse 220px 70px at 86% 14%, rgba(255,255,255,.85) 60%, transparent 62%),
    radial-gradient(ellipse 180px 60px at 70% 62%, rgba(255,255,255,.55) 60%, transparent 62%),
    linear-gradient(180deg,#c4e7ff 0%,#e9f6ff 60%,#ffffff 100%);
  background-attachment:fixed;
  padding-inline:16px; padding-block:12px 40px;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:var(--font-display); line-height:1.15; margin:0; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:4px solid var(--sun); outline-offset:3px; border-radius:12px}
.app{max-width:760px; margin-inline:auto; display:flex; flex-direction:column; gap:16px}

/* barra superior */
.top{display:flex; align-items:center; gap:10px; justify-content:space-between; min-width:0}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand svg{width:44px; height:44px; flex:none}
.brand b{font-family:var(--font-display); font-size:1.15rem; font-weight:800; color:var(--blue-d); line-height:1.1}
.link-btn{background:transparent; border:2px solid var(--sky-2); border-radius:999px; padding:8px 14px; font-size:.9rem; font-weight:800; color:var(--blue-d); min-height:44px; background-color:rgba(255,255,255,.7)}
.link-btn:hover{border-color:var(--blue)}

/* tarjetas */
.card{background:var(--white); border-radius:28px; padding:22px; box-shadow:0 6px 0 var(--sky-2), 0 18px 30px rgba(18,48,107,.10); min-width:0}
.hero{text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px}
.hero .owl{width:150px; height:150px}
.hero h1{font-size:2.3rem; color:var(--blue-d)}
.hero .eng{font-family:var(--font-display); font-weight:800; font-size:1.05rem; letter-spacing:.06em; text-transform:uppercase; color:var(--blue)}
.lead{font-size:1.25rem}
.note{background:#fff8dc; border:3px dashed var(--sun); border-radius:18px; padding:12px 16px}
.deco{display:flex; gap:18px; justify-content:center; align-items:flex-end}
.deco svg{width:56px; height:56px}
.how{text-align:left; width:100%; background:var(--sky); border-radius:20px; padding:16px 18px}
.how h2{font-size:1.35rem; margin-bottom:6px; color:var(--blue-d)}
.how ul{margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:4px}

/* botones */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:60px; padding:12px 26px; border:0; border-radius:20px;
  font-family:var(--font-display); font-weight:800; font-size:1.3rem; letter-spacing:.02em; text-align:center; line-height:1.15;
  transition:transform .12s ease, box-shadow .12s ease}
.btn-sun{background:var(--sun); color:var(--ink); box-shadow:0 6px 0 var(--sun-d)}
.btn-blue{background:var(--blue); color:#fff; box-shadow:0 6px 0 var(--blue-d)}
.btn-ghost{background:#fff; color:var(--blue-d); box-shadow:0 0 0 3px var(--sky-2) inset}
.btn:active{transform:translateY(4px)}
.btn-sun:active{box-shadow:0 2px 0 var(--sun-d)}
.btn-blue:active{box-shadow:0 2px 0 var(--blue-d)}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none}
.btn-big{width:100%; font-size:1.5rem; min-height:68px}
.stack{display:flex; flex-direction:column; gap:12px; width:100%}

/* progreso */
.prog{display:flex; flex-direction:column; gap:8px}
.prog-row{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-family:var(--font-display); font-weight:800; color:var(--blue-d); font-size:1.15rem}
.bar{height:22px; background:#fff; border-radius:999px; box-shadow:0 0 0 3px var(--sky-2) inset; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--sun),#ffdf6b); border-radius:999px; transition:width .35s ease}
.dots{display:flex; flex-wrap:wrap; gap:6px}
.dot{width:40px; height:40px; border-radius:12px; border:2px solid var(--sky-2); background:#fff; font-weight:800; font-size:.9rem; color:var(--blue-d); padding:0}
.dot.done{background:var(--blue); border-color:var(--blue); color:#fff}
.dot.now{outline:4px solid var(--sun); outline-offset:1px}

/* pregunta */
.chip{display:inline-flex; align-self:flex-start; background:var(--blue); color:#fff; font-family:var(--font-display); font-weight:800; font-size:.95rem; letter-spacing:.07em; padding:4px 14px; border-radius:999px; text-transform:uppercase}
.sec-es{font-size:1.1rem; color:var(--blue-d)}
.qcard{display:flex; flex-direction:column; gap:16px}
.qtext{font-size:1.6rem; font-weight:800; line-height:1.35}
.blank{display:inline-block; min-width:5ch; border-bottom:5px solid var(--sun); color:transparent; margin-inline:2px; user-select:none}
.base{display:inline-flex; align-self:flex-start; gap:8px; align-items:center; background:#fff8dc; border:3px solid var(--sun); padding:4px 14px; border-radius:14px; font-weight:800}
.opts{display:flex; flex-direction:column; gap:12px}
.opt{display:flex; align-items:center; gap:14px; width:100%; min-height:64px; text-align:left; background:#fff; border:3px solid var(--sky-2); border-radius:20px; padding:10px 16px; font-size:1.35rem; font-weight:800;
  box-shadow:0 4px 0 var(--sky-2); transition:transform .1s ease}
.opt .let{flex:none; width:40px; height:40px; border-radius:50%; background:var(--sky); color:var(--blue-d); display:grid; place-items:center; font-family:var(--font-display)}
.opt:active{transform:translateY(3px); box-shadow:0 1px 0 var(--sky-2)}
.opt[aria-pressed="true"]{background:var(--blue); border-color:var(--blue-d); color:#fff; box-shadow:0 4px 0 var(--blue-d)}
.opt[aria-pressed="true"] .let{background:var(--sun); color:var(--ink)}
.write{width:100%; font:inherit; font-size:1.7rem; font-weight:800; padding:14px 18px; border:4px solid var(--sky-2); border-radius:20px; color:var(--ink); background:#fff; min-height:68px}
.write:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 5px rgba(255,201,40,.7)}
.hint{background:var(--sky); border-radius:14px; padding:8px 14px}

/* relacionar */
.match{display:flex; flex-direction:column; gap:16px}
.match h3{font-size:1.1rem; color:var(--blue-d); margin-bottom:8px}
.words{display:flex; flex-wrap:wrap; gap:10px}
.w{display:flex; align-items:center; gap:8px; min-height:56px; padding:8px 14px; background:#fff; border:3px solid var(--sky-2); border-radius:18px; font-weight:800; font-size:1.15rem; box-shadow:0 4px 0 var(--sky-2)}
.w small{font-family:var(--font-display); font-size:.95rem; color:var(--blue)}
.w .tag{min-width:30px; height:30px; border-radius:50%; background:var(--sky); display:grid; place-items:center; font-family:var(--font-display); color:var(--blue-d)}
.w.set{border-color:var(--blue)}
.w.set .tag{background:var(--blue); color:#fff}
.w.sel{background:var(--sun); border-color:var(--sun-d); box-shadow:0 4px 0 var(--sun-d)}
.w.sel .tag{background:#fff}
.means{display:flex; flex-direction:column; gap:10px}
.m{display:flex; align-items:center; gap:12px; min-height:58px; width:100%; text-align:left; padding:8px 14px; background:#fff; border:3px solid var(--sky-2); border-radius:18px; font-weight:800; font-size:1.1rem}
.m .let{flex:none; width:36px; height:36px; border-radius:50%; background:var(--sky); display:grid; place-items:center; font-family:var(--font-display); color:var(--blue-d)}
.m .used{margin-left:auto; font-size:.85rem; font-family:var(--font-display); color:#fff; background:var(--blue); border-radius:999px; padding:2px 10px}
.m.on{background:#fff8dc; border-color:var(--sun)}
.step-msg{background:#fff8dc; border:3px dashed var(--sun); border-radius:16px; padding:10px 14px}

/* navegación */
.nav{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.finish-row{display:flex; justify-content:center}

/* resultados */
.res{display:flex; flex-direction:column; gap:14px; align-items:center; text-align:center}
.res .owl{width:110px; height:110px}
.score{font-family:var(--font-display); font-weight:800; font-size:4.2rem; line-height:1; color:var(--blue-d)}
.score small{font-size:1.6rem; color:var(--blue)}
.stars{display:flex; gap:6px}
.stars svg{width:38px; height:38px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%}
.stat{background:var(--sky); border-radius:18px; padding:10px 6px; min-width:0}
.stat b{display:block; font-family:var(--font-display); font-size:1.9rem; line-height:1.1}
.stat span{font-size:.95rem}
.stat.g b{color:var(--ok)} .stat.r b{color:var(--bad)}
.msg{font-family:var(--font-display); font-size:1.45rem; font-weight:700; background:#fff8dc; border:3px solid var(--sun); border-radius:20px; padding:14px 18px; width:100%}
.tabs{display:flex; gap:10px; flex-wrap:wrap}
.tab{min-height:48px; padding:8px 18px; border-radius:999px; border:3px solid var(--sky-2); background:#fff; font-weight:800; color:var(--blue-d)}
.tab[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:#fff}
.review{display:flex; flex-direction:column; gap:14px}
.rv{background:#fff; border-radius:22px; padding:18px; border-left:10px solid var(--skip); box-shadow:0 4px 0 var(--sky-2); display:flex; flex-direction:column; gap:8px; min-width:0}
.rv.ok{border-left-color:var(--ok)} .rv.bad{border-left-color:var(--bad)}
.rv-head{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.rv-n{font-family:var(--font-display); font-weight:800; color:var(--blue-d); font-size:1.15rem}
.rv-sec{font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; background:var(--sky); border-radius:999px; padding:2px 10px}
.rv-q{font-size:1.2rem; font-weight:800; overflow-wrap:anywhere}
.rv-q mark{background:#fff3b0; color:inherit; border-radius:6px; padding:0 4px}
.lbl{font-size:.85rem; letter-spacing:.06em; text-transform:uppercase; color:var(--skip)}
.rv .line{overflow-wrap:anywhere}
.verdict{font-family:var(--font-display); font-weight:800; font-size:1.25rem}
.rv.ok .verdict{color:var(--ok)} .rv.bad .verdict{color:var(--bad)} .rv.skip .verdict{color:var(--skip)}
.correct-box{background:var(--ok-bg); border-radius:14px; padding:8px 12px}
.learn{background:var(--sky); border-radius:14px; padding:10px 14px; display:flex; flex-direction:column; gap:6px}
.exa{font-weight:700}
.foot{text-align:center; font-size:.9rem; color:var(--blue-d); display:flex; flex-direction:column; gap:10px; align-items:center}

/* ventana */
.veil{position:fixed; inset:0; background:rgba(18,48,107,.55); display:grid; place-items:center; padding:16px; z-index:20}
.modal{background:#fff; border-radius:28px; padding:24px; max-width:460px; width:100%; display:flex; flex-direction:column; gap:14px; box-shadow:0 10px 0 var(--sky-2)}
.modal h2{font-size:1.6rem; color:var(--blue-d)}

/* inicio */
.hello{display:flex; gap:12px; align-items:center; justify-content:space-between}
.hello>div{min-width:0}
.hello h1{font-size:1.9rem; color:var(--blue-d)}
.hello .date{font-size:1.05rem}
.starchip{display:inline-flex; gap:6px; align-items:center; background:#fff8dc; border:3px solid var(--sun); border-radius:999px; padding:6px 16px; font-family:var(--font-display); font-weight:800; font-size:1.3rem}
.sec-title{font-size:1.4rem; color:var(--blue-d)}
.tag-demo{background:#fff; border:3px dashed var(--sky-2); border-radius:14px; padding:6px 12px; font-size:.95rem}
.mat{display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:#fff8dc; border:4px solid var(--sun); border-radius:22px; padding:14px 16px}
.mat .ico{font-size:2.2rem}
.mat .txt{flex:1 1 180px; min-width:0}
.mat .btn{min-height:56px; font-size:1.1rem; padding-inline:18px}
.tasks{display:flex; flex-direction:column; gap:14px}
.task{position:relative; display:flex; gap:14px; background:#fff; border-radius:26px; padding:16px; box-shadow:0 6px 0 var(--sky-2), 0 14px 24px rgba(18,48,107,.08); overflow:hidden; min-width:0}
.task .emo{flex:none; width:64px; height:64px; border-radius:20px; background:var(--sky); display:grid; place-items:center; font-size:2rem}
.task .body{display:flex; flex-direction:column; gap:6px; min-width:0; flex:1}
.task h3{font-size:1.4rem; overflow-wrap:anywhere}
.task .due{color:var(--blue); font-size:1rem}
.task .acts{display:flex; flex-direction:column; gap:10px; margin-top:6px}
.task .btn{min-height:60px; font-size:1.2rem}
.chip.sm{font-size:.8rem; padding:2px 12px}
.task.cel{animation:celebrate .9s ease forwards}
.task.cel .btn{pointer-events:none}
.plus{position:absolute; right:16px; top:10px; font-family:var(--font-display); font-weight:800; font-size:1.6rem; color:var(--sun-d); animation:rise .9s ease forwards}
.bit{position:absolute; top:40%; left:50%; width:10px; height:14px; border-radius:3px; animation:burst .9s ease-out forwards}
@keyframes celebrate{0%{transform:scale(1)}25%{transform:scale(1.04)}100%{transform:scale(.96); opacity:.15}}
@keyframes rise{from{transform:translateY(0); opacity:1}to{transform:translateY(-26px); opacity:0}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg); opacity:0}}
.progress-day{display:flex; flex-direction:column; gap:6px}
.progress-day .bar{height:16px}
.more{text-align:center; color:var(--blue-d)}
.alldone{text-align:center; display:flex; flex-direction:column; gap:12px; align-items:center}
.alldone .owl{width:130px; height:130px}
.alldone h2{font-size:2rem; color:var(--blue-d)}
.prize{background:#fff8dc; border:4px solid var(--sun); border-radius:20px; padding:12px 18px; font-family:var(--font-display); font-weight:700; font-size:1.3rem}
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.tile{display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center; text-align:center; min-height:116px; padding:12px 8px; background:#fff; border:3px solid var(--sky-2); border-radius:24px; box-shadow:0 6px 0 var(--sky-2); font-family:var(--font-display); font-weight:800; font-size:1.2rem; color:var(--blue-d); line-height:1.15}
.tile span.big{font-size:2.3rem; line-height:1}
.tile .big-owl{width:2.6rem; height:2.6rem}
.tile:active{transform:translateY(4px); box-shadow:0 2px 0 var(--sky-2)}
.topic{display:flex; flex-direction:column; gap:8px}
.topic h3{font-size:1.5rem; color:var(--blue-d)}
.medals{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px}
.medal{background:#fff; border-radius:20px; padding:12px; text-align:center; border:3px solid var(--sun); display:flex; flex-direction:column; gap:2px; min-width:0}
.medal.lock{border-color:var(--sky-2); filter:grayscale(1); opacity:.6}
.medal .e{font-size:2.2rem}
.wordrow{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; padding:10px 0; border-bottom:2px solid var(--sky)}
.wordrow b{font-family:var(--font-display); font-size:1.3rem; color:var(--blue-d)}
.fab{position:fixed; right:calc(14px + env(safe-area-inset-right,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:68px; height:68px; border-radius:50%; border:4px solid #fff; background:var(--sun); box-shadow:0 6px 18px rgba(18,48,107,.3); padding:4px; z-index:10}
.fab svg{width:100%; height:100%}
.bubble{position:fixed; right:calc(14px + env(safe-area-inset-right,0px)); bottom:calc(94px + env(safe-area-inset-bottom,0px)); max-width:min(320px, calc(100vw - 28px)); background:#fff; border:4px solid var(--sun); border-radius:22px; padding:14px 16px; box-shadow:0 10px 24px rgba(18,48,107,.25); z-index:10; display:flex; flex-direction:column; gap:8px}
.app{padding-bottom:96px}

/* inicio en dos columnas, mamá, diccionario */
.app.wide{max-width:1040px}
.homegrid{display:grid; gap:16px; grid-template-columns:minmax(0,1fr)}
.maincol{display:flex; flex-direction:column; gap:16px; min-width:0}
.matsweek{display:flex; flex-direction:column; gap:8px; align-self:start}
.matsweek .small, .small{font-size:.9rem; color:var(--blue-d)}
.matsweek .grp{font-family:var(--font-display); font-size:1.05rem; color:var(--blue); margin-top:4px}
.mrow{display:flex; gap:10px; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:2px solid var(--sky); flex-wrap:wrap}
.mrow .mtxt{display:flex; flex-direction:column; min-width:0; flex:1 1 140px}
.mrow .mtxt span{font-size:.85rem; color:var(--blue-d); text-transform:capitalize}
.mrow.taken{opacity:.6}
.mrow.taken b{text-decoration:line-through}
.have{min-height:44px; padding:6px 14px; border-radius:999px; border:3px solid var(--sky-2); background:#fff; font-weight:800; color:var(--blue-d)}
.have.on{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.pill{display:inline-block; background:var(--sky); border-radius:999px; padding:2px 12px; font-size:.85rem; font-weight:800}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
@media (min-width:900px){
  .homegrid{grid-template-columns:minmax(0,1fr) 340px; align-items:start}
  .matsweek{position:sticky; top:12px}
  .tiles{grid-template-columns:repeat(4,1fr)}
}
.momgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.mom{display:flex; flex-direction:column; gap:12px}
.mom .sec-title{margin-top:8px}
.fld{display:flex; flex-direction:column; gap:4px; min-width:0}
.fld>span{font-size:.85rem; font-weight:800; color:var(--blue-d)}
.fld input, .fld textarea{width:100%; font:inherit; font-size:1rem; font-weight:700; padding:10px 12px; border:3px solid var(--sky-2); border-radius:14px; color:var(--ink); background:#fff; min-height:48px}
.fld textarea{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.9rem; min-height:160px}
.fld input:focus, .fld textarea:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 4px rgba(255,201,40,.7)}
.erow{display:grid; gap:8px; background:var(--sky); border-radius:18px; padding:12px}
.erow .del{justify-self:end}
.warn{background:#fff8dc; border:3px solid var(--sun); border-radius:14px; padding:10px 14px}
.warn ul, .err ul{margin:6px 0 0; padding-left:1.2em}
.err{background:var(--bad-bg); color:var(--bad); border-radius:14px; padding:10px 14px}
.good-note{background:var(--ok-bg); color:var(--ok); border-radius:14px; padding:10px 14px}
.srow{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:2px solid var(--sky); min-width:0}
.srow>div{min-width:0}
.srow p{margin:0}
.semo{font-size:1.8rem; flex:none}
.pinbox{display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; text-align:left}
.pinbox label{font-weight:800; color:var(--blue-d)}
.pinbox input{font:inherit; font-size:2rem; letter-spacing:.5em; text-align:center; padding:10px; border:4px solid var(--sky-2); border-radius:16px; min-height:64px; width:100%}
.dtopics{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px}

.fcard{position:relative; display:flex; flex-direction:column; gap:6px; align-items:center; justify-content:center; text-align:center; min-height:130px; padding:12px; background:#fff; border:3px solid var(--sky-2); border-radius:22px; box-shadow:0 5px 0 var(--sky-2); font-size:1rem}

.fcard .hint{font-size:.8rem; color:var(--skip)}

.fcard .ex{font-size:.85rem; font-weight:700}
.fcard .ex2{font-size:.8rem; opacity:.9}
.fcard .kn{position:absolute; top:6px; right:8px; width:26px; height:26px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; font-size:.9rem}
.opt.good{background:var(--ok-bg); border-color:var(--ok); box-shadow:0 4px 0 var(--ok)}
.opt.bad{background:var(--bad-bg); border-color:var(--bad); box-shadow:0 4px 0 var(--bad)}
.opt[disabled]{cursor:default}
.fb{font-family:var(--font-display); font-weight:800; font-size:1.2rem}
.fb.good{color:var(--ok)} .fb.bad{color:var(--bad)}

.gcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
.gcard{display:flex; flex-direction:column; gap:6px; align-items:center; text-align:center; background:#fff; border:3px solid var(--sky-2); border-radius:24px; padding:18px 12px; box-shadow:0 6px 0 var(--sky-2); font-size:1rem; color:var(--blue-d)}
.gcard .big{font-size:2.6rem; line-height:1}
.gcard b{font-family:var(--font-display); font-size:1.4rem}
.tile.locked{opacity:.6; background:var(--skip-bg); border-style:dashed}
.tiles .tile:last-child:nth-child(odd){grid-column:1/-1}
.mem{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
@media (min-width:600px){ .mem{grid-template-columns:repeat(4,1fr)} }
.mcard{min-height:92px; padding:6px; border-radius:18px; border:3px solid var(--blue-d); background:var(--blue); color:#fff; display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:1.05rem; line-height:1.15; overflow-wrap:anywhere; box-shadow:0 5px 0 var(--blue-d)}
.mcard svg{width:44px; height:44px}
.mcard.up{background:#fff; color:var(--ink); border-color:var(--sun)}
.mcard.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.mcard[disabled]{opacity:1; cursor:default}
.slots{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.slot{width:44px; height:54px; border-bottom:5px solid var(--sun); display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:1.8rem; color:var(--blue-d)}
.slot.fill{background:var(--sky); border-radius:12px 12px 0 0}
.slot.hintch{color:var(--skip)}
.letters{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.lt{width:56px; height:60px; border-radius:16px; border:3px solid var(--sky-2); background:#fff; font-family:var(--font-display); font-weight:800; font-size:1.7rem; color:var(--blue-d); box-shadow:0 4px 0 var(--sky-2); padding:0}

.auth{display:flex; flex-direction:column; gap:12px; text-align:center; align-items:center}

.auth .err{background:var(--bad-bg); color:var(--bad); border-radius:14px; padding:10px 14px}
.auth .good{background:var(--ok-bg); color:var(--ok); border-radius:14px; padding:10px 14px}
.syncst{font-weight:800}
.syncst.bad{color:var(--bad)}

function normalize(s){

    if(["home","topics","stars","dict","study","mom","games","welcome","quiz","results"].indexOf(s.screen) < 0) s.screen = "home";

    s.exam.idx = Math.min(Math.max(+s.exam.idx || 0, 0), EXAM_STEPS.length-1);
    s.vc = s.vc || {};

/* Trae de la nube lo más reciente. Examen y contenido: gana el cambio más nuevo. Inicio (tareas, estrellas): se juntan los de todos los aparatos. */
function reconcile(){
  if(!window.KXSync || !KXSync.hasSession() || KXSync.hasPending()) return Promise.resolve();
  return KXSync.pull().then(function(r){
    if(!r.ok || KXSync.hasPending() || isTyping()) return;
    var rows = r.rows, changed = false, pushed = false;
    var re = rows.examen, mine = S.at || 0;
    if(re && (re.at || 0) > mine){
      var ne = normalize({screen:"home", mode:re.mode, exam:re.exam, practice:re.practice, vc:re.vc});
      var wasEmpty = !ne.exam.done && answeredCount(EXAM, ne.exam.answers) === 0 && !ne.practice;
      S.mode = ne.mode; S.exam = ne.exam; S.practice = ne.practice; S.vc = ne.vc; S.at = re.at; changed = true;
      modal = null; selWord = null; matchHint = "";
      if(S.screen === "results" && !store().done) S.screen = wasEmpty ? "home" : "quiz";
      if(wasEmpty && S.screen === "welcome") S.screen = "home";
    } else if(mine > 0 && (!re || mine > (re.at || 0))){ KXSync.push("examen", rowExam()); pushed = true; }
    var rh = rows.inicio, merged = mergeHome(S.home, rh);
    if(!homeEq(merged, S.home)){ S.home = merged; changed = true; }
    if(!homeEmpty(S.home) && (!rh || !homeEq(merged, rh))){ KXSync.push("inicio", S.home); pushed = true; }
    var rc = rows.contenido, mineC = S.cAt || 0;
    if(rc && (rc.cAt || 0) > mineC){
      var nc = normContent(rc);
      S.agenda = nc.agenda; S.temas = nc.temas; S.pinHash = nc.pinHash; S.pinSalt = nc.pinSalt; S.cAt = nc.cAt; changed = true;
    } else if(mineC > 0 && (!rc || mineC > (rc.cAt || 0))){ KXSync.push("contenido", rowContent()); pushed = true; }
    writeLocal();

  });
}

  undercooked:"poco cocinado", undercover:"de incógnito", oversee:"supervisar", undershirt:"camiseta interior", overlook:"pasar por alto", overcook:"cocinar demasiado"};
function vocabTopics(){
  var words = Object.keys(C).filter(function(k){ return k !== "prefix"; }).map(function(k){
    var c = C[k], es = CORTA[k] || c.es; return {en:c.word, es:es, aceptadas:[es, c.es], ejemplo_en:c.ex, ejemplo_es:c.exEs};
  });
  var list = [{id:"overunder", materia:"English", title:"Prefijos OVER- y UNDER-", emo:"🔤", words:words}];

  });

}
function topicById(id){ var l = vocabTopics(); for(var i=0;i<l.length;i++) if(l[i].id === id) return l[i]; return null; }
function wkey(tid, w){ return tid + ":" + String(w.en).toLowerCase(); }

            : '<b lang="en">'+esc(w.en)+'</b><span class="hint">toca para ver</span>') + '</button>';

function startQuiz2(tp){
  var words = shuffle(tp.words).slice(0, 5), all = tp.words;
  var items = words.map(function(w){
    var others = shuffle(all.filter(function(x){ return x.es !== w.es; })).slice(0, 2).map(function(x){ return x.es; });
    if(others.length < 2){
      vocabTopics().forEach(function(t){ t.words.forEach(function(x){ if(others.length < 2 && x.es !== w.es && others.indexOf(x.es) < 0) others.push(x.es); }); });
    }
    return {w:w, opts:shuffle([w.es].concat(others)), pick:null};
  });
  dict.quiz = {items:items, i:0, ok:0, done:false};
}
function renderQuiz2(tp){
  var q = dict.quiz;
  if(q.done){
    var msg = q.ok === q.items.length ? "¡Perfecto! 🌟" : q.ok >= 3 ? "¡Muy bien! 👏" : "¡Buen intento! Sigue practicando 💪";

      '<button class="btn btn-ghost" type="button" data-act="dict-end">Ver las tarjetas</button></div></section>' + footer();
  }
  var it = q.items[q.i], answered = it.pick !== null, last = q.i === q.items.length - 1;
  var opts = it.opts.map(function(o, i){
    var cls = "opt";
    if(answered){ if(o === it.w.es) cls += " good"; else if(o === it.pick) cls += " bad"; }
    return '<button type="button" class="'+cls+'" data-act="dict-pick" data-v="'+esc(o)+'"'+(answered?" disabled":"")+'><span class="let">'+LET[i]+'</span><span>'+esc(o)+'</span></button>';
  }).join("");
  var fb = "";
  if(answered) fb = it.pick === it.w.es ? '<p class="fb good">🎉 ¡Muy bien!</p>' : '<p class="fb bad">¡Casi! Significa «'+esc(it.w.es)+'». Ya lo sabes para la próxima. 💙</p>';
  return subHeader(tp.title, "dict-end", "← Salir") +

    '<div class="opts">'+opts+'</div>'+fb+
    (answered ? '<button class="btn btn-sun btn-big" type="button" data-act="dict-next">'+(last ? "Ver mi resultado" : "Siguiente →")+'</button>' : "") + '</main>' + footer();
}

/* ===================================================== ZONA DE MAMÁ ===== */
function isDate(v){ return typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v) && dkey(parseD(v)) === v; }
function str(v){ return typeof v === "string" ? v.trim() : (typeof v === "number" ? String(v) : ""); }
function mondayOf(k){ var d = parseD(k), w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return dkey(d); }
function normUrl(u){ u = str(u); return /^https?:\/\/\S+$/i.test(u) ? u : ""; }

/* Lee el texto pegado (tolera ```json y comillas "bonitas" de chats). */
function parseImportText(txt){
  txt = String(txt || "").trim();
  if(!txt) return {ok:false, msg:"Pega el contenido o elige un archivo primero."};
  txt = txt.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();
  try{ return {ok:true, obj:JSON.parse(txt)}; }catch(e1){
    try{ return {ok:true, obj:JSON.parse(txt.replace(/[“”]/g, '"').replace(/[‘’]/g, "'"))}; }catch(e2){
      return {ok:false, msg:"No pude leer el texto como un archivo de importación. Revisa que empiece con { y termine con } y que esté completo. (" + e1.message + ")"};
    }
  }
}

function validateAgenda(o){
  var E = [], W = [], d = {semana:str(o.semana), tareas:[], materiales:[], videos:[], notas:[]};
  if(!isDate(d.semana)) E.push("La semana debe ser una fecha con este formato: 2026-10-12 (año-mes-día).");
  function list(name){
    if(o[name] == null) return [];
    if(Array.isArray(o[name])) return o[name];
    E.push("«" + name + "» debe ser una lista."); return [];
  }
  function near(label, k){
    if(isDate(k) && isDate(d.semana) && Math.abs(dayDiff(k) - dayDiff(d.semana)) > 21) W.push(label + ": la fecha " + k + " está lejos de la semana " + d.semana + ". ¿Es correcta?");
  }
  var seen = {};
  function uid(kind, x, i, pre){
    var id = str(x.id) || (pre + (i + 1));
    if(seen[kind + id]) E.push((kind === "t" ? "Tarea " : kind === "m" ? "Material " : "Video ") + (i + 1) + ": el id «" + id + "» está repetido.");
    seen[kind + id] = 1; return id;
  }
  list("tareas").forEach(function(x, i){
    var n = "Tarea " + (i + 1);
    if(!x || typeof x !== "object"){ E.push(n + ": no se entiende."); return; }
    var it = {id:uid("t", x, i, "t"), materia:str(x.materia), titulo:str(x.titulo), detalle:str(x.detalle), fecha:str(x.fecha), entrega:str(x.entrega)};
    if(!it.titulo) E.push(n + ": falta el título.");
    if(!isDate(it.fecha)) E.push(n + (it.titulo ? " («" + it.titulo + "»)" : "") + ": falta la fecha o no es válida (usa 2026-10-13).");
    if(it.entrega && !isDate(it.entrega)) E.push(n + ": la fecha de entrega no es válida (usa 2026-10-14).");
    if(!it.materia) W.push(n + ": no tiene materia.");
    if(it.entrega && isDate(it.entrega) && isDate(it.fecha) && it.entrega < it.fecha) W.push(n + ": la entrega es antes de la fecha de hacerla.");
    near(n, it.fecha); d.tareas.push(it);
  });
  list("materiales").forEach(function(x, i){
    var n = "Material " + (i + 1);
    if(!x || typeof x !== "object"){ E.push(n + ": no se entiende."); return; }
    var it = {id:uid("m", x, i, "m"), materia:str(x.materia), material:str(x.material), llevar_el:str(x.llevar_el)};
    if(!it.material) E.push(n + ": falta qué material es.");
    if(!isDate(it.llevar_el)) E.push(n + (it.material ? " («" + it.material + "»)" : "") + ": falta el día de llevarlo o no es válido (usa 2026-10-15).");
    near(n, it.llevar_el); d.materiales.push(it);
  });
  list("videos").forEach(function(x, i){
    var n = "Video " + (i + 1);
    if(!x || typeof x !== "object"){ E.push(n + ": no se entiende."); return; }
    var it = {id:uid("v", x, i, "v"), materia:str(x.materia), titulo:str(x.titulo), url:str(x.url), fecha:str(x.fecha)};
    if(!it.titulo) E.push(n + ": falta el título.");
    if(!normUrl(it.url)) E.push(n + (it.titulo ? " («" + it.titulo + "»)" : "") + ": el enlace debe empezar con https://");
    if(!isDate(it.fecha)) E.push(n + ": falta la fecha o no es válida (usa 2026-10-13).");
    near(n, it.fecha); d.videos.push(it);
  });
  list("notas_para_mama").forEach(function(t){ if(str(t)) d.notas.push(str(t)); });
  if(!E.length && !d.tareas.length && !d.materiales.length && !d.videos.length) E.push("La agenda no trae tareas, materiales ni videos.");
  return {errors:E, warnings:W, draft:d};
}

function validateTema(o){
  var E = [], W = [];
  var t = {id:str(o.id), materia:str(o.materia), titulo:str(o.titulo), titulo_es:str(o.titulo_es), fecha_examen:str(o.fecha_examen),
           resumen:[], subtemas:[], preguntas:[], vocabulario:[]};
  if(!/^[a-z0-9][a-z0-9_-]*$/i.test(t.id)) E.push("El tema necesita un «id» sin espacios ni acentos, por ejemplo science-water-cycle.");
  if(!t.titulo) E.push("Falta el «titulo» del tema.");
  if(!t.materia) W.push("El tema no tiene materia.");
  if(t.fecha_examen && !isDate(t.fecha_examen)){ E.push("«fecha_examen» no es válida (usa 2026-10-20)."); }
  if(!t.fecha_examen) t.fecha_examen = "";
  var tipos = ["opcion_multiple", "verdadero_falso", "unir", "completar"];
  if(Array.isArray(o.subtemas)) o.subtemas.forEach(function(x){ if(str(x)) t.subtemas.push(str(x)); });
  (Array.isArray(o.resumen) ? o.resumen : []).forEach(function(r, i){
    if(!r || !str(r.en) || !str(r.es)){ E.push("Resumen " + (i + 1) + ": necesita «en» y «es»."); return; }
    t.resumen.push({en:str(r.en), es:str(r.es), emoji:str(r.emoji)});
  });
  var seen = {};
  (Array.isArray(o.preguntas) ? o.preguntas : []).forEach(function(p, i){
    var n = "Pregunta " + (i + 1);
    if(!p || typeof p !== "object"){ E.push(n + ": no se entiende."); return; }
    var q = {id:str(p.id) || ("q" + (i + 1)), subtema:str(p.subtema), tipo:str(p.tipo), pregunta_en:str(p.pregunta_en), pregunta_es:str(p.pregunta_es), explicacion_es:str(p.explicacion_es)};
    if(seen[q.id]) E.push(n + ": el id «" + q.id + "» está repetido."); seen[q.id] = 1;
    if(tipos.indexOf(q.tipo) < 0){ E.push(n + ": el tipo «" + q.tipo + "» no existe. Usa: " + tipos.join(", ") + "."); return; }
    if(!q.pregunta_en) E.push(n + ": falta «pregunta_en».");
    if(!q.explicacion_es) W.push(n + ": no tiene «explicacion_es» (Killian no verá por qué se equivocó).");
    if(t.subtemas.length && q.subtema && t.subtemas.indexOf(q.subtema) < 0) W.push(n + ": el subtema «" + q.subtema + "» no está en la lista de subtemas.");
    if(q.tipo === "opcion_multiple"){
      var ops = (Array.isArray(p.opciones) ? p.opciones : []).map(str).filter(Boolean);
      q.opciones = ops; q.correcta = str(p.correcta);
      if(ops.length < 2) E.push(n + ": necesita al menos 2 «opciones».");
      else if(ops.indexOf(q.correcta) < 0) E.push(n + ": la «correcta» («" + q.correcta + "») no está entre las opciones.");
    } else if(q.tipo === "verdadero_falso"){
      var c = p.correcta, cs = String(c).toLowerCase();
      if(c === true || cs === "true" || cs === "verdadero" || cs === "v") q.correcta = true;
      else if(c === false || cs === "false" || cs === "falso" || cs === "f") q.correcta = false;
      else E.push(n + ": «correcta» debe ser true o false.");
    } else if(q.tipo === "unir"){
      var pares = (Array.isArray(p.pares) ? p.pares : []).map(function(x){
        x = x || {}; return {izquierda:str(x.izquierda || x.en), derecha:str(x.derecha || x.es)};
      }).filter(function(x){ return x.izquierda && x.derecha; });
      q.pares = pares;
      if(pares.length < 2) E.push(n + ": «unir» necesita al menos 2 pares con «izquierda» y «derecha».");
    } else {
      q.respuesta = str(p.respuesta != null ? p.respuesta : p.correcta);
      q.aceptadas = (Array.isArray(p.aceptadas) ? p.aceptadas : []).map(str).filter(Boolean);
      if(!q.respuesta) E.push(n + ": falta la «respuesta».");
      if(q.pregunta_en.indexOf("___") < 0) W.push(n + ": la frase no tiene el hueco ______.");
    }
    t.preguntas.push(q);
  });
  (Array.isArray(o.vocabulario) ? o.vocabulario : []).forEach(function(v, i){
    if(!v || !str(v.en) || !str(v.es)){ E.push("Palabra " + (i + 1) + ": necesita «en» y «es»."); return; }
    t.vocabulario.push({en:str(v.en), es:str(v.es), aceptadas:(Array.isArray(v.aceptadas) ? v.aceptadas : []).map(str).filter(Boolean),
      ejemplo_en:str(v.ejemplo_en), ejemplo_es:str(v.ejemplo_es)});
  });
  if(!t.preguntas.length && !E.length) E.push("El tema no trae preguntas.");
  if(t.preguntas.length && t.preguntas.length < 10) W.push("Solo hay " + t.preguntas.length + " preguntas. Conviene tener más para varias rondas distintas.");
  if(!t.vocabulario.length) W.push("El tema no trae vocabulario.");
  return {errors:E, warnings:W, draft:t};
}

var imp = {text:"", msg:"", kind:null, draft:null, errors:[], warnings:[], src:"import", busy:false};
function hashPin(pin, salt){

function applyAgenda(d){
  var sem = d.semana, ag = S.agenda || {tareas:[], materiales:[], videos:[], notas:[]}, pre = sem + ":";
  function keep(x){ return x.semana !== sem; }
  ag.tareas = ag.tareas.filter(keep).concat(d.tareas.map(function(x){ return {id:pre + x.id, semana:sem, materia:x.materia, titulo:x.titulo, detalle:x.detalle, fecha:x.fecha, entrega:x.entrega}; }));
  ag.materiales = ag.materiales.filter(keep).concat(d.materiales.map(function(x){ return {id:pre + x.id, semana:sem, materia:x.materia, material:x.material, llevar_el:x.llevar_el}; }));
  ag.videos = ag.videos.filter(keep).concat(d.videos.map(function(x){ return {id:pre + x.id, semana:sem, materia:x.materia, titulo:x.titulo, url:x.url, fecha:x.fecha}; }));
  ag.notas = (ag.notas || []).filter(keep).concat(d.notas.filter(function(n){ return str(n); }).map(function(n){ return {semana:sem, texto:str(n)}; }));
  var firstReal = !S.agenda;
  S.agenda = ag; saveContent();
  if(firstReal){
    ["tasks","vids","mats","have","days"].forEach(function(m){ Object.keys(S.home[m]).forEach(function(k){ if(/^(d-|demo:)/.test(k)) delete S.home[m][k]; }); });
    saveHome();
  }
}

function extraClick(act, el, ev){
  if(gamesClick(act, el)) return true;
  switch(act){
    case "go-mom": momView = "menu"; momNote = ""; pinMsg = ""; S.screen = "mom"; helperOpen = false; writeLocal(); render({top:true}); return true;
    case "pin-go": pinGo(); return true;
    case "mom-go":
      var v = el.getAttribute("data-v") || "menu";
      momView = v; pinMsg = ""; momNote = "";
      if(v === "import"){ imp.msg = ""; imp.errors = []; }
      if(v === "pin"){ momOk = true; }
      render({top:true}); return true;
    case "imp-clear": imp = {text:"", msg:"", kind:null, draft:null, errors:[], warnings:[], src:"import"}; render(); return true;
    case "imp-sample":
      if(el.getAttribute("data-v") === "agenda"){ imp.text = sampleAgendaText(); imp.msg = ""; imp.errors = []; render(); }
      else fetch("ejemplos/tema-ejemplo.json").then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(t){ imp.text = t; imp.msg = ""; imp.errors = []; render(); })
        .catch(function(){ imp.msg = "No pude cargar el ejemplo (¿hay internet?)."; render(); });
      return true;
    case "imp-check":
      imp.text = val("imptext") || imp.text; imp.msg = ""; imp.errors = []; imp.warnings = [];
      var pr = parseImportText(imp.text);
      if(!pr.ok){ imp.msg = pr.msg; render(); return true; }
      var o = pr.obj;
      if(!o || typeof o !== "object" || Array.isArray(o)){ imp.msg = "El contenido debe ser un solo bloque que empiece con { ."; render(); return true; }
      var res;
      if(o.tipo === "agenda") res = validateAgenda(o);
      else if(o.tipo === "tema") res = validateTema(o);
      else { imp.msg = "Falta el campo «tipo»: debe decir \"agenda\" o \"tema\"."; render(); return true; }
      imp.kind = o.tipo; imp.draft = res.draft; imp.errors = res.errors; imp.warnings = res.warnings; imp.src = "import"; imp.exists = false;
      if(!res.errors.length){ momView = "preview"; render({top:true}); } else render();
      return true;
    case "week-edit": imp = {text:"", msg:"", kind:"agenda", draft:draftFromWeek(el.getAttribute("data-v")), errors:[], warnings:[], src:"manual", exists:true}; momView = "edit"; render({top:true}); return true;
    case "week-new":
      imp = {text:"", msg:"", kind:"agenda", draft:{semana:mondayOf(todayKey()), tareas:[], materiales:[], videos:[], notas:[]}, errors:[], warnings:[], src:"manual", exists:false};
      momView = "edit"; render({top:true}); return true;
    case "e-add":
      var k = el.getAttribute("data-e"), d = imp.draft, t = todayKey();
      if(k === "tareas") d.tareas.push({id:newId("t"), materia:"", titulo:"", detalle:"", fecha:t, entrega:""});
      if(k === "materiales") d.materiales.push({id:newId("m"), materia:"", material:"", llevar_el:t});
      if(k === "videos") d.videos.push({id:newId("v"), materia:"", titulo:"", url:"", fecha:t});
      if(k === "notas") d.notas.push("");
      render(); return true;
    case "e-del":
      imp.draft[el.getAttribute("data-e")].splice(+el.getAttribute("data-i"), 1); render(); return true;
    case "e-save":
      imp.msg = ""; imp.errors = [];
      if(imp.kind === "agenda"){
        var d2 = imp.draft;
        var chk = validateAgenda({tipo:"agenda", semana:d2.semana, tareas:d2.tareas, materiales:d2.materiales, videos:d2.videos, notas_para_mama:d2.notas});
        if(chk.errors.length){ imp.errors = chk.errors; imp.warnings = chk.warnings; render(); return true; }
        applyAgenda(chk.draft); momNote = "✅ Agenda guardada: semana del " + chk.draft.semana + ".";
      } else {
        var t2 = imp.draft, i, found = false;
        if(!t2.preguntas.length){ imp.errors = ["El tema debe tener al menos una pregunta."]; render(); return true; }
        for(i=0;i<S.temas.length;i++) if(S.temas[i].id === t2.id){ S.temas[i] = t2; found = true; }
        if(!found) S.temas.push(t2);
        saveContent(); momNote = "✅ Tema guardado: " + (t2.titulo_es || t2.titulo) + ".";
      }
      imp.draft = null; imp.text = ""; momView = "menu"; render({top:true}); return true;
    case "ask-deltema": modal = {type:"deltema", id:el.getAttribute("data-id")}; render(); return true;
    case "do-deltema":
      S.temas = S.temas.filter(function(x){ return x.id !== modal.id; }); modal = null; saveContent(); render(); return true;
    case "ask-delweek": modal = {type:"delweek", sem:imp.draft.semana}; render(); return true;
    case "do-delweek":
      var sem = modal.sem; modal = null;
      if(S.agenda){ ["tareas","materiales","videos","notas"].forEach(function(kk){ S.agenda[kk] = (S.agenda[kk] || []).filter(function(x){ return x.semana !== sem; }); }); }
      saveContent(); imp.draft = null; momView = "weeks"; momNote = "Semana borrada."; render({top:true}); return true;
    /* tareas y materiales */
    case "have":
      var id = el.getAttribute("data-id");
      S.home.have[id] = S.home.have[id] > 0 ? -Date.now() : Date.now();   /* negativo = quitado; gana el más reciente */
      saveHome(); render(); return true;
    case "study": studyId = el.getAttribute("data-id"); S.screen = "study"; writeLocal(); render({top:true}); return true;
    /* diccionario */
    case "dict-open": dict.topic = el.getAttribute("data-id"); dict.flip = {}; dict.quiz = null; S.screen = "dict"; writeLocal(); render({top:true}); return true;
    case "dict-back": dict.topic = null; dict.quiz = null; render({top:true}); return true;
    case "flip": var fi = el.getAttribute("data-i"); dict.flip[fi] = !dict.flip[fi]; render(); return true;
    case "dict-play": startQuiz2(topicById(dict.topic)); render({top:true}); return true;
    case "dict-end": dict.quiz = null; render({top:true}); return true;
    case "dict-pick":
      var qz = dict.quiz, it = qz.items[qz.i]; if(it.pick !== null) return true;
      it.pick = el.getAttribute("data-v");
      if(it.pick === it.w.es){ qz.ok++; S.home.known[wkey(dict.topic, it.w)] = S.home.known[wkey(dict.topic, it.w)] || Date.now(); saveHome(); }
      render(); return true;
    case "dict-next":
      var q3 = dict.quiz;
      if(q3.i >= q3.items.length - 1){ q3.done = true; gameDone(); } else q3.i++;
      render({top:true}); return true;
  }
  return false;
}
function extraInput(ev){

/* --- Memoria --- */
function startMemory(){
  var words = shuffle(poolWords()).slice(0, 6), cards = [];
  words.forEach(function(w, i){ cards.push({k:i+"a", p:i, t:w.en, lang:"en"}); cards.push({k:i+"b", p:i, t:w.es, lang:"es"}); });
  gm.s = {words:words, cards:shuffle(cards), open:[], done:{}, moves:0, lock:false, fin:false};
}
function renderMemory(){
  var s = gm.s;
  if(s.fin) return gmBack("Memoria") + resultCard("¡Lo lograste! 🌟", s.moves + ' <small>intentos</small>', "Encontraste todas las parejas. Esas palabras ya cuentan como aprendidas.") + footer();
  return gmBack("Memoria") + '<p class="lead">Toca dos tarjetas: una en inglés y su significado en español.</p>' +
    '<div class="mem">' + s.cards.map(function(c, i){
      var up = s.open.indexOf(i) >= 0 || s.done[c.p];
      return '<button type="button" class="mcard'+(up?" up":"")+(s.done[c.p]?" ok":"")+'" data-act="gm-flip" data-i="'+i+'"'+(up?" disabled":"")+' aria-label="'+(up ? esc(c.t) : "Tarjeta sin voltear")+'">' +
        (up ? '<span lang="'+c.lang+'">'+esc(c.t)+'</span>' : '<svg aria-hidden="true"><use href="#owl"/></svg>') + '</button>';
    }).join("") + '</div><p class="more">Intentos: '+s.moves+' · Parejas: '+Object.keys(s.done).length+' de '+s.words.length+'</p>' + footer();
}

/* --- Arma la palabra --- */
function scramble(w){
  var L = w.toUpperCase().split(""), r, n = 0;
  do { r = shuffle(L); n++; } while(r.join("") === L.join("") && n < 8);
  return r.map(function(ch, i){ return {id:i, ch:ch}; });
}
function startBuild(){
  var words = shuffle(poolWords().filter(function(x){ return /^[a-z]{3,12}$/i.test(x.en); })).slice(0, 5);
  if(words.length < 3) return false;
  gm.s = {items:words.map(function(x){ return {x:x, letters:scramble(x.en)}; }), i:0, slots:[], solved:false, wrong:false, hint:false, ok:0, fin:false};
  return true;
}
function renderBuild(){
  var s = gm.s;
  if(s.fin) return gmBack("Arma la palabra") + resultCard("¡Muy bien! 🎉", s.ok + ' <small>de '+s.items.length+'</small>', "Las palabras que armaste ya cuentan como aprendidas.") + footer();
  var it = s.items[s.i], len = it.x.en.length, word = it.x.en.toUpperCase();
  var slots = ""; for(var j=0;j<len;j++){
    var id = s.slots[j], ch = id == null ? (s.hint && j === 0 ? word[0] : "") : it.letters[id].ch;
    slots += '<span class="slot'+(id != null ? " fill" : (ch ? " hintch" : ""))+'">'+esc(ch)+'</span>';
  }
  var letters = it.letters.map(function(l){
    var used = s.slots.indexOf(l.id) >= 0;
    return '<button type="button" class="lt" data-act="gm-letter" data-i="'+l.id+'"'+((used || s.solved) ? " disabled" : "")+'>'+esc(l.ch)+'</button>';
  }).join("");
  var last = s.i === s.items.length - 1;
  return gmBack("Arma la palabra") + '<div class="prog-row"><span>Palabra '+(s.i+1)+' de '+s.items.length+'</span></div>' +
    '<main class="card qcard"><span class="chip">En español significa</span><p class="qtext">'+esc(it.x.es)+'</p>' +
    '<div class="slots" lang="en" aria-label="Tu palabra">'+slots+'</div>' +
    (s.wrong ? '<p class="fb bad">¡Casi! Inténtalo otra vez. 💙</p>' : '') +
    (s.solved ? '<p class="fb good">🎉 ¡Muy bien! Es <b lang="en">'+esc(word)+'</b></p>' : '') +
    '<div class="letters" lang="en">'+letters+'</div>' +
    (s.solved ? '<button class="btn btn-sun btn-big" type="button" data-act="gm-next">'+(last ? "Ver mi resultado" : "Siguiente →")+'</button>'
              : '<div class="nav"><button class="btn btn-ghost" type="button" data-act="gm-undo">⌫ Borrar</button><button class="btn btn-ghost" type="button" data-act="gm-hint">💡 Pista</button></div>') +
    '</main>' + footer();
}

/* --- Relámpago --- */
function nextSpeed(){
  var pool = poolWords(), w = pool[Math.floor(Math.random() * pool.length)];
  var others = shuffle(pool.filter(function(x){ return x.es !== w.es; })).map(function(x){ return x.es; });
  var uniq = []; others.forEach(function(o){ if(uniq.indexOf(o) < 0) uniq.push(o); });
  gm.s.cur = {w:w, opts:shuffle([w.es].concat(uniq.slice(0, 2)))};
}
function startSpeed(){
  gm.s = {t0:Date.now(), dur:30, score:0, tries:0, over:false, cur:null};
  nextSpeed(); stopTimer();
  gmTimer = setInterval(function(){
    if(S.screen !== "games" || gm.game !== "speed" || !gm.s || gm.s.over){ stopTimer(); return; }
    var left = Math.max(0, gm.s.dur - (Date.now() - gm.s.t0) / 1000);
    var tx = document.getElementById("gtime"), bar = document.getElementById("gbar");
    if(tx) tx.textContent = Math.ceil(left); if(bar) bar.style.width = (left / gm.s.dur * 100) + "%";
    if(left <= 0){
      stopTimer(); gm.s.over = true;
      var newBest = gm.s.score > S.home.speed; if(newBest) S.home.speed = gm.s.score;
      gm.s.newBest = newBest; gameDone(); render({top:true});
    }
  }, 200);
}
function renderSpeed(){
  var s = gm.s;
  if(s.over) return gmBack("Relámpago") + resultCard(s.newBest && s.score > 0 ? "¡Nuevo récord! 🏆" : "¡Tiempo! ⚡", s.score + ' <small>aciertos</small>', "Tu récord es "+S.home.speed+". ¡Puedes superarlo!") + footer();
  var left = Math.max(0, Math.ceil(s.dur - (Date.now() - s.t0) / 1000));
  return gmBack("Relámpago") +
    '<div class="prog-row"><span>⏱️ <b id="gtime">'+left+'</b> s</span><span>✅ '+s.score+'</span></div><div class="bar"><i id="gbar" style="width:'+(left/s.dur*100)+'%"></i></div>' +
    '<main class="card qcard"><span class="chip">¿Qué significa?</span><p class="qtext" lang="en" style="font-size:2.2rem">'+esc(s.cur.w.en)+'</p>' +
    '<div class="opts">' + s.cur.opts.map(function(o, i){ return '<button type="button" class="opt" data-act="gm-speed" data-v="'+esc(o)+'"><span class="let">'+LET[i]+'</span><span>'+esc(o)+'</span></button>'; }).join("") + '</div></main>' + footer();
}

function gamesClick(act, el){
  switch(act){
    case "gm-pool": gm.pool = el.getAttribute("data-id"); render(); return true;
    case "gm-hub": gmEnd(); render({top:true}); return true;
    case "gm-start":
      var g = el.getAttribute("data-g"); gm.game = g; stopTimer();
      if(g === "memory") startMemory();
      else if(g === "build"){ if(!startBuild()){ gm.game = null; gm.s = null; render(); return true; } }
      else startSpeed();
      render({top:true}); return true;
    case "gm-flip":
      var s = gm.s, i = +el.getAttribute("data-i"), c = s.cards[i];
      if(s.lock || s.done[c.p] || s.open.indexOf(i) >= 0) return true;
      s.open.push(i);
      if(s.open.length === 2){
        s.moves++;
        var a = s.cards[s.open[0]], b = s.cards[s.open[1]];
        if(a.p === b.p && a.k !== b.k){
          s.done[a.p] = 1; s.open = [];
          if(Object.keys(s.done).length === s.words.length){ s.fin = true; s.words.forEach(function(w){ markKnown(w.tid, w.w); }); gameDone(); }
        } else {
          s.lock = true; render();
          setTimeout(function(){ s.open = []; s.lock = false; if(gm.game === "memory" && gm.s === s) render(); }, 900);
          return true;
        }
      }
      render(); return true;
    case "gm-letter":
      var b2 = gm.s; if(b2.solved) return true;
      var it = b2.items[b2.i], id = +el.getAttribute("data-i");
      if(b2.slots.indexOf(id) >= 0) return true;
      b2.wrong = false; b2.slots.push(id);
      if(b2.slots.length === it.x.en.length){
        var tried = b2.slots.map(function(k){ return it.letters[k].ch; }).join("");
        if(tried === it.x.en.toUpperCase()){ b2.solved = true; b2.ok++; markKnown(it.x.tid, it.x.w); }
        else { b2.wrong = true; render(); setTimeout(function(){ if(gm.s === b2 && b2.wrong){ b2.slots = []; b2.wrong = false; render(); } }, 900); return true; }
      }
      render(); return true;
    case "gm-undo": gm.s.slots.pop(); gm.s.wrong = false; render(); return true;
    case "gm-hint": gm.s.hint = true; render(); return true;
    case "gm-next":
      var b3 = gm.s;
      if(b3.i >= b3.items.length - 1){ b3.fin = true; gameDone(); }
      else { b3.i++; b3.slots = []; b3.solved = false; b3.wrong = false; b3.hint = false; }
      render({top:true}); return true;
    case "gm-speed":
      var sp = gm.s; if(sp.over) return true;
      sp.tries++;
      if(el.getAttribute("data-v") === sp.cur.w.es){ sp.score++; markKnown(sp.cur.w.tid, sp.cur.w.w); saveHome(); }
      nextSpeed(); render(); return true;
    case "games-locked": gm.lockMsg = true; render(); setTimeout(function(){ gm.lockMsg = false; if(S.screen === "home") render(); }, 3500); return true;
  }
  return false;
}

function authError(e){
  var m = String((e && e.message) || e || "");
  if(/invalid login/i.test(m)) return "El correo o la contraseña no coinciden.";
  if(/not confirmed/i.test(m)) return "Falta confirmar tu correo. Abre el mensaje que te enviamos y pulsa el enlace.";
  if(/already registered/i.test(m)) return "Ese correo ya tiene cuenta. Pulsa «Ya tengo cuenta» para entrar.";
  if(/password/i.test(m) && /6|short|weak/i.test(m)) return "La contraseña debe tener al menos 6 caracteres.";
  if(/valid email|invalid.*email/i.test(m)) return "Escribe un correo válido.";
  if(/rate limit|too many/i.test(m)) return "Hubo muchos intentos. Espera unos minutos y vuelve a probar.";
  if(!navigator.onLine || /fetch|network|failed/i.test(m)) return "No hay internet. Conéctate y vuelve a intentar.";
  return "No se pudo entrar. Revisa tus datos e intenta otra vez.";
}

function stepNumbers(step){ return step.length > 1 ? step[0].n + "–" + step[step.length-1].n : String(step[0].n); }

function progressHtml(){
  var st = store(), qs = qsOf(), steps = stepsOf(), step = steps[st.idx];
  var total = qs.length, ans = answeredCount(qs, st.answers);
  var label = S.mode === "practice"
    ? "Pregunta " + (st.idx+1) + " de " + total
    : (step.length > 1 ? "Preguntas " + stepNumbers(step) : "Pregunta " + stepNumbers(step)) + " de " + total;
  var dots = qs.map(function(q, i){
    var si = steps.findIndex(function(s){ return s.indexOf(q) >= 0; });
    var cls = "dot" + (isAnswered(st.answers[q.id]) ? " done" : "") + (step.indexOf(q) >= 0 ? " now" : "");
    return '<button type="button" class="'+cls+'" data-act="goto" data-i="'+si+'" aria-label="Ir a la pregunta '+(S.mode==="practice"?i+1:q.n)+'"' + (step.indexOf(q) >= 0 ? ' aria-current="step"' : '') + '>'+(S.mode==="practice"?i+1:q.n)+'</button>';
  }).join("");
  return '<div class="prog-row"><span id="plabel">'+label+'</span><span id="pcount">✏️ '+ans+' de '+total+' respondidas</span></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+ans+'" aria-label="Preguntas respondidas"><i id="pbar" style="width:'+Math.round(ans/total*100)+'%"></i></div>' +
    '<div class="dots" id="dots">'+dots+'</div>';
}

function renderQuestion(q, st){
  var a = st.answers[q.id], sec = SECTIONS[q.sec], h = "";
  if(S.mode === "practice") h += '<span class="chip">Práctica</span><p class="sec-es">Elige o escribe la palabra que tenga sentido.</p>';
  else h += '<span class="chip">Sección '+q.sec+' · '+esc(sec.name)+'</span><p class="sec-es">'+esc(sec.es)+'</p>';
  h += '<p class="qtext" lang="en">'+blankHtml(q.prompt)+'</p>';
  if(q.base) h += '<p class="base" lang="en">Base word: <b>'+esc(q.base)+'</b></p>';
  if(q.type === "mc"){
    h += '<div class="opts" role="group" aria-label="Opciones">' + q.opts.map(function(o, i){
      return '<button type="button" class="opt" lang="en" data-act="pick" data-v="'+esc(o)+'" aria-pressed="'+(a === o)+'"><span class="let">'+LET[i]+'</span><span>'+esc(o)+'</span></button>';
    }).join("") + '</div>';
  } else {
    if(S.mode === "practice") h += '<p class="hint">💡 Pista: significa «'+esc(C[q.concept].es)+'».</p>';
    h += '<label for="ans" class="sec-es">Escribe la palabra completa en inglés:</label>' +
      '<input id="ans" class="write" lang="en" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="30" value="'+esc(a||"")+'" placeholder="Escribe aquí…">';
  }
  return h;
}

function renderMatch(step, st){
  var used = {};
  step.forEach(function(q){ if(st.answers[q.id]) used[st.answers[q.id]] = q; });
  if(selWord && !step.some(function(q){ return q.id === selWord; })) selWord = null;
  var h = '<span class="chip">Sección 4 · '+esc(SECTIONS[4].name)+'</span><p class="sec-es">'+esc(SECTIONS[4].es)+'</p>';
  var cur = step.find(function(q){ return q.id === selWord; });
  var msg = matchHint || (cur ? "Paso 2: toca el significado de <b>"+esc(cur.word)+"</b>." : "Paso 1: toca una palabra en inglés.");
  h += '<div class="match"><div><h3>1. Palabras</h3><div class="words">' + step.map(function(q){
    var l = st.answers[q.id];
    return '<button type="button" class="w'+(l?' set':'')+(q.id===selWord?' sel':'')+'" lang="en" data-act="mw" data-q="'+q.id+'" aria-pressed="'+(q.id===selWord)+'">' +
      '<small>'+q.n+'.</small>'+esc(q.word)+'<span class="tag" aria-label="'+(l?'elegiste '+l:'sin elegir')+'">'+(l||'?')+'</span></button>';
  }).join("") + '</div></div>' +
  '<p class="step-msg" id="mmsg" role="status">'+msg+'</p>' +
  '<div><h3>2. Significados</h3><div class="means">' + LET.map(function(L){
    var u = used[L];
    return '<button type="button" class="m'+(u?' on':'')+'" data-act="mm" data-l="'+L+'"><span class="let">'+L+'</span><span>'+esc(MEANINGS[L])+'</span>' + (u ? '<span class="used" lang="en">'+esc(u.word)+'</span>' : '') + '</button>';
  }).join("") + '</div></div></div>';
  return h;
}

function renderQuiz(){
  var st = store(), steps = stepsOf(), step = steps[st.idx], last = st.idx === steps.length-1;
  var exam = S.mode === "exam";
  var body = step.length > 1 ? renderMatch(step, st) : renderQuestion(step[0], st);
  return header() +
    '<section class="prog" aria-label="Progreso">' + progressHtml() + '</section>' +
    '<main class="card qcard" id="qcard">' + body + '</main>' +
    '<nav class="nav" aria-label="Navegación">' +
      '<button type="button" class="btn btn-ghost" data-act="prev"'+(st.idx===0?' disabled':'')+'>← Anterior</button>' +
      (last ? '<button type="button" class="btn btn-sun" data-act="finish">'+(exam?'TERMINAR EXAMEN':'TERMINAR PRÁCTICA')+'</button>'
            : '<button type="button" class="btn btn-blue" data-act="next">Siguiente →</button>') +
    '</nav>' +
    (last ? '' : '<div class="finish-row"><button type="button" class="btn btn-ghost" data-act="finish">'+(exam?'TERMINAR EXAMEN':'TERMINAR PRÁCTICA')+'</button></div>') +
    footer();
}

/* ------------------------------------------------------------- RESULTADOS */
function reviewItem(g){
  var q = g.q, a = g.a, cls = g.ok ? "ok" : (g.answered ? "bad" : "skip");
  var head = '<div class="rv-head"><span class="rv-n">Pregunta '+(S.mode==="practice" ? (qsOf().indexOf(q)+1) : q.n)+'</span>' +
    (S.mode==="exam" ? '<span class="rv-sec">'+esc(SECTIONS[q.sec].name)+'</span>' : '') + '</div>';
  var qline, mine, right;
  if(q.type === "match"){
    qline = 'Match: <mark lang="en">'+esc(q.word)+'</mark> = ?';
    mine = g.answered ? a+". "+MEANINGS[a] : "(sin responder)";
    right = q.ans+". "+MEANINGS[q.ans];
  } else {
    qline = '<span lang="en">'+blankHtml(q.prompt)+'</span>' + (q.base ? ' <span lang="en">(Base word: '+esc(q.base)+')</span>' : "");
    mine = g.answered ? String(a).trim().toUpperCase() : "(sin responder)";
    right = q.ans.toUpperCase();
    if(q.type === "mc") right = q.ans;
  }
  var verdict;
  if(g.ok) verdict = ["✅ ¡Muy bien, Killian!","✅ ¡Correcto! ¡Sigue así!","✅ ¡Excelente trabajo!"][(q.n||0) % 3];
  else if(!g.answered) verdict = "⚪ Esta se quedó sin responder. ¡Vamos a aprenderla!";
  else verdict = ["❌ ¡Casi lo logras!","❌ Vamos a aprenderlo juntos.","❌ ¡Buen intento! Mira esto."][(q.n||0) % 3];

  var h = '<article class="rv '+cls+'">' + head + '<p class="rv-q">'+qline+'</p>' +
    '<p class="line"><span class="lbl">Respuesta de Killian</span><br><b lang="en">'+esc(mine)+'</b></p>' +
    '<p class="verdict">'+verdict+'</p>';
  if(!g.ok){
    h += '<p class="line correct-box"><span class="lbl">Respuesta correcta</span><br><b lang="en">'+esc(right)+'</b>' +
      (q.type !== "match" && q.prompt.indexOf("______") >= 0 ? '<br><span lang="en">'+filledHtml(q.prompt, q.ans)+'</span>' : '') + '</p>';
  }
  h += '<div class="learn"><p class="line"><span class="lbl">Explicación</span><br>'+esc(q.exp)+'</p>';
  if(!g.ok){
    if(g.answered && q.type === "mc" && D[a] && a !== q.ans) h += '<p class="line">Tú elegiste <b lang="en">'+esc(a)+'</b>, que significa «'+esc(D[a])+'».</p>';
    if(g.answered && q.type === "write") h += '<p class="line">Fíjate cómo se escribe: <b lang="en">'+esc(C[q.concept].parts || q.ans.toUpperCase())+'</b> = <b lang="en">'+esc(q.ans.toUpperCase())+'</b>.</p>';
    h += '<p class="exa line"><span class="lbl">Otro ejemplo</span><br><span lang="en">'+esc(C[q.concept].ex)+'</span><br>'+esc(C[q.concept].exEs)+'</p>';
  }
  return h + '</div></article>';
}

function actionButtons(wrongCount, unans){
  var exam = S.mode === "exam", h = '<div class="stack">';
  if(unans > 0) h += '<button class="btn btn-blue btn-big" data-act="resume" type="button">SEGUIR RESPONDIENDO (faltan '+unans+')</button>';
  if(exam){
    h += wrongCount > 0
      ? '<button class="btn btn-sun btn-big" data-act="practice" type="button">VOLVER A PRACTICAR MIS ERRORES</button>'
      : '<p class="note">🎉 ¡No tienes errores que practicar!</p>';
    h += '<button class="btn btn-blue btn-big" data-act="repeat" type="button">REPETIR TODO EL EXAMEN</button>';
  } else {
    if(wrongCount > 0) h += '<button class="btn btn-sun btn-big" data-act="practice" type="button">PRACTICAR DE NUEVO LO QUE AÚN FALLO</button>';
    h += '<button class="btn btn-blue btn-big" data-act="back-exam" type="button">VOLVER A MIS RESULTADOS DEL EXAMEN</button>' +
         '<button class="btn btn-ghost" data-act="repeat" type="button">REPETIR TODO EL EXAMEN</button>';
  }
  return h + '</div>';
}

function renderResults(){
  var st = store(), qs = qsOf(), grades = gradeAll(qs, st.answers);
  var right = grades.filter(function(g){ return g.ok; }).length, wrong = qs.length - right;
  var unans = grades.filter(function(g){ return !g.answered; }).length;
  var exam = S.mode === "exam";
  var score = right * POINTS, pct = Math.round(right / qs.length * 100);
  var stars = Math.round((exam ? score : pct) / 20), starHtml = "";
  for(var i=0;i<5;i++) starHtml += '<svg aria-hidden="true" fill="'+(i<stars?'#ffc928':'#dff2ff')+'"><use href="#star"/></svg>';
  var big = exam ? '<div class="score" aria-label="Puntuación final">'+score+' <small>/ 100</small></div>'
                 : '<div class="score" aria-label="Respuestas correctas">'+right+' <small>de '+qs.length+'</small></div>';
  var shown = filter === "bad" ? grades.filter(function(g){ return !g.ok; }) : grades;
  return header() +
  '<main class="card res">' +
    '<svg class="owl" aria-hidden="true"><use href="#owl"/></svg>' +
    '<h1>'+(exam ? "Resultados de Killian" : "Práctica de mis errores — Killian")+'</h1>' +
    big + '<div class="stars" role="img" aria-label="'+stars+' de 5 estrellas">'+starHtml+'</div>' +
    '<div class="stats"><div class="stat g"><b>'+right+'</b><span>✅ correctas</span></div>' +
      '<div class="stat r"><b>'+wrong+'</b><span>❌ incorrectas'+(unans ? ' ('+unans+' sin responder)' : '')+'</span></div>' +
      '<div class="stat"><b>'+pct+'%</b><span>de aciertos</span></div></div>' +
    '<p class="msg">'+messageFor(exam ? score : pct)+'</p>' +
    (exam ? '' : '') +
    actionButtons(wrong, unans) +
  '</main>' +
  '<section aria-label="Revisión de preguntas" class="review-wrap" style="display:flex;flex-direction:column;gap:14px">' +
    '<h2 style="color:var(--blue-d)">Revisión de todas las preguntas</h2>' +
    '<div class="tabs"><button type="button" class="tab" data-act="filter" data-f="all" aria-pressed="'+(filter==="all")+'">Ver todas ('+qs.length+')</button>' +
    '<button type="button" class="tab" data-act="filter" data-f="bad" aria-pressed="'+(filter==="bad")+'">Solo las que fallé ('+wrong+')</button></div>' +
    '<div class="review">' + (shown.length ? shown.map(reviewItem).join("") : '<p class="note">🎉 ¡Todas fueron correctas!</p>') + '</div>' +
  '</section>' +
  '<section class="card">' + actionButtons(wrong, unans) + '</section>' + footer();
}

/* ------------------------------------------------------------------ VENTANAS */
function renderModal(){
  if(!modal) return "";
  var h;
  if(modal.type === "unanswered"){
    var list = modal.list.join(", ");
    if(modal.none) h = '<h2>¡Espera un momento! ✋</h2><p>Todavía <b>no has respondido ninguna</b> pregunta.</p><p>Si terminas ahora, todas contarán como incorrectas.</p>' +
      '<button type="button" class="btn btn-sun" data-act="modal-close" id="mfocus">Seguir respondiendo</button>' +
      '<button type="button" class="btn btn-ghost" data-act="finish-now">Terminar de todos modos</button>';
    else h = '<h2>¡Espera un momento! ✋</h2><p>Te faltan <b>'+modal.list.length+'</b> '+(modal.list.length===1?'pregunta':'preguntas')+' sin responder ('+esc(list)+').</p>' +
      '<p>Si terminas ahora, esas preguntas contarán como incorrectas.</p>' +
      '<button type="button" class="btn btn-sun" data-act="modal-close" id="mfocus">Seguir respondiendo</button>' +
      '<button type="button" class="btn btn-ghost" data-act="finish-now">Terminar de todos modos</button>';
  } else if(modal.type === "deltema"){
    h = '<h2>¿Borrar este tema?</h2><p>Se borrará el tema con sus preguntas y vocabulario. Puedes volver a importarlo después.</p>' +
      '<button type="button" class="btn btn-ghost" data-act="modal-close" id="mfocus">No, conservarlo</button>' +
      '<button type="button" class="btn btn-sun" data-act="do-deltema">Sí, borrar</button>';
  } else if(modal.type === "delweek"){
    h = '<h2>¿Borrar esta semana?</h2><p>Se borrarán sus tareas, materiales, videos y notas. Lo que Killian ya marcó se conserva en sus estrellas.</p>' +
      '<button type="button" class="btn btn-ghost" data-act="modal-close" id="mfocus">No, conservarla</button>' +
      '<button type="button" class="btn btn-sun" data-act="do-delweek">Sí, borrar</button>';
  } else if(modal.type === "logout"){
    h = '<h2>¿Cerrar sesión?</h2><p>Este aparato dejará de estar conectado. Tu progreso sigue guardado en la nube y volverá al entrar de nuevo.</p>' +
      '<button type="button" class="btn btn-ghost" data-act="modal-close" id="mfocus">No, quedarme</button>' +
      '<button type="button" class="btn btn-sun" data-act="logout">Sí, cerrar sesión</button>';
  } else {
    h = '<h2>¿Borrar el progreso del examen?</h2><p>Se borrarán las respuestas y resultados del examen en todos tus aparatos. Tus tareas y estrellas no se borran.</p>' +
      '<button type="button" class="btn btn-ghost" data-act="modal-close" id="mfocus">No, mantener mi progreso</button>' +
      '<button type="button" class="btn btn-sun" data-act="reset">Sí, borrar y empezar</button>';
  }
  return '<div class="veil" data-act="veil"><div class="modal" role="dialog" aria-modal="true">'+h+'</div></div>';
}

/* ------------------------------------------------------------------ RENDER */
function render(opts){
  opts = opts || {};
  var y = window.scrollY;
  var needLogin = window.KXSync && KXSync.enabled && !KXSync.hasSession();
  var html;
  if(needLogin) html = renderAuth();
  else switch(S.screen){
    case "home": html = renderHome(); break;
    case "mom": html = renderMom(); break;
    case "games": html = renderGames(); break;
    case "study": html = renderStudy(); break;
    case "topics": html = renderTopics(); break;
    case "stars": html = renderStars(); break;
    case "dict": html = renderDict(); break;
    case "welcome": html = renderWelcome(); break;
    case "results": html = renderResults(); break;
    default: html = renderQuiz();
  }
  app.className = "app" + (!needLogin && S.screen === "home" ? " wide" : "");
  app.innerHTML = html + (needLogin ? "" : renderFab() + renderModal());
  if(opts.top) window.scrollTo(0, 0); else window.scrollTo(0, y);
  if(modal){ var f = document.getElementById("mfocus"); if(f) f.focus(); }
}

function updateChrome(){
  var st = store(), qs = qsOf(), n = answeredCount(qs, st.answers);
  var pc = document.getElementById("pcount"), pb = document.getElementById("pbar");
  if(pc) pc.textContent = "✏️ " + n + " de " + qs.length + " respondidas";
  if(pb){ pb.style.width = Math.round(n/qs.length*100) + "%"; if(pb.parentNode) pb.parentNode.setAttribute("aria-valuenow", n); }
  var steps = stepsOf(), step = steps[st.idx];
  var dots = document.querySelectorAll("#dots .dot");
  qs.forEach(function(q, i){ if(dots[i]) dots[i].classList.toggle("done", isAnswered(st.answers[q.id])); });
}

/* ------------------------------------------------------------------ ACCIONES */
function go(idx){
  var st = store(); st.idx = Math.min(Math.max(idx, 0), stepsOf().length-1);
  selWord = null; matchHint = "";
  save(); render({top:true});
}
function finishNow(){
  var gr = gradeAll(qsOf(), store().answers), okn = gr.filter(function(g){ return g.ok; }).length;
  if(S.mode === "exam"){ S.home.tries++; S.home.best = Math.max(S.home.best, okn * POINTS); }
  else S.home.prac++;
  store().done = true; S.screen = "results"; modal = null; filter = "all";
  save(); saveHome(); render({top:true});
}
function tryFinish(){
  var st = store(), qs = qsOf();
  var missing = qs.filter(function(q){ return !isAnswered(st.answers[q.id]); }).map(function(q){ return S.mode==="practice" ? qs.indexOf(q)+1 : q.n; });
  if(missing.length){ modal = {type:"unanswered", list:missing, none:missing.length === qs.length}; render(); }
  else finishNow();
}
function startPractice(){
  var st = store(), qs = qsOf();
  var wrongG = gradeAll(qs, st.answers).filter(function(g){ return !g.ok; });
  var seen = {}, concepts = [];
  wrongG.forEach(function(g){ if(!seen[g.q.concept]){ seen[g.q.concept] = 1; concepts.push(g.q.concept); } });
  if(!concepts.length) return;
  var list = concepts.map(function(c, i){
    var variants = BANK[c], k = (S.vc[c] || 0) % variants.length;
    S.vc[c] = (S.vc[c] || 0) + 1;
    var v = variants[k];
    return {id:"p"+(i+1)+"-"+c, n:i+1, sec:0, type:v.type, concept:c, prompt:v.prompt, base:v.base||"",
      opts:v.opts ? shuffle(v.opts) : null, ans:v.ans, exp:C[c].exp};
  });
  S.practice = {qs:list, idx:0, answers:{}, done:false};
  S.mode = "practice"; S.screen = "quiz"; selWord = null; matchHint = ""; filter = "all";
  save(); render({top:true});
}
function repeatExam(){
  S.exam = freshExam(); S.practice = null; S.mode = "exam"; S.screen = "quiz";
  selWord = null; matchHint = ""; modal = null; filter = "all";
  save(); render({top:true});
}

app.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if(!el || !app.contains(el)) return;
  var act = el.getAttribute("data-act"), st = store();
  if(act === "veil"){ if(ev.target === el){ modal = null; render(); } return; }
  if(extraClick(act, el, ev)) return;
  switch(act){
    case "home": S.screen = "home"; helperOpen = false; momOk = false; dict.quiz = null; writeLocal(); render({top:true}); break;
    case "go-screen": S.screen = el.getAttribute("data-s"); helperOpen = false; if(S.screen === "dict"){ dict.topic = null; dict.quiz = null; } writeLocal(); render({top:true}); break;
    case "open-topic": S.screen = "welcome"; S.mode = "exam"; writeLocal(); render({top:true}); break;
    case "helper": helperOpen = !helperOpen; render(); break;
    case "done": markDone(el.getAttribute("data-k"), el.getAttribute("data-id")); break;
    case "start": S.screen = "quiz"; S.mode = "exam"; writeLocal(); render({top:true}); break;
    case "see-results": S.screen = "results"; S.mode = "exam"; filter = "all"; writeLocal(); render({top:true}); break;
    case "prev": go(st.idx-1); break;
    case "next": go(st.idx+1); break;
    case "goto": go(+el.getAttribute("data-i")); break;
    case "pick":
      var q = stepsOf()[st.idx][0];
      st.answers[q.id] = el.getAttribute("data-v"); save(); render(); break;
    case "mw":
      selWord = el.getAttribute("data-q") === selWord ? null : el.getAttribute("data-q");
      matchHint = ""; render(); break;
    case "mm":
      var step = stepsOf()[st.idx], L = el.getAttribute("data-l");
      if(!selWord){ matchHint = "Primero toca una palabra en inglés 👆"; render(); break; }
      matchHint = "";
      if(st.answers[selWord] === L){ delete st.answers[selWord]; }
      else {
        step.forEach(function(x){ if(st.answers[x.id] === L) delete st.answers[x.id]; });
        st.answers[selWord] = L;
        var next = step.find(function(x){ return !st.answers[x.id]; });
        selWord = next ? next.id : null;
      }
      save(); render(); break;
    case "finish": tryFinish(); break;
    case "finish-now": finishNow(); break;
    case "resume":
      var rst = store(), rsteps = stepsOf(), ri = rsteps.findIndex(function(sp){ return sp.some(function(q){ return !isAnswered(rst.answers[q.id]); }); });
      rst.done = false; S.screen = "quiz"; rst.idx = ri < 0 ? 0 : ri; selWord = null; matchHint = "";
      save(); render({top:true}); break;
    case "modal-close": modal = null; render(); break;
    case "ask-reset": modal = {type:"reset"}; render(); break;
    case "reset":
      S.exam = freshExam(); S.practice = null; S.mode = "exam"; S.vc = {}; S.screen = "welcome";
      modal = null; selWord = null; matchHint = ""; filter = "all"; save(); render({top:true}); break;
    case "ask-logout": modal = {type:"logout"}; render(); break;
    case "logout":
      modal = null;
      KXSync.signOut().catch(function(){}).then(function(){
        clearSaved(); S = fresh(); selWord = null; matchHint = ""; filter = "all";
        auth.pass = ""; auth.msg = ""; render({top:true});
      });
      break;
    case "auth-toggle": auth.mode = auth.mode === "up" ? "in" : "up"; auth.msg = ""; render(); break;
    case "auth-go": ev.preventDefault(); doAuth(); break;
    case "practice": startPractice(); break;
    case "repeat": repeatExam(); break;
    case "back-exam": S.mode = "exam"; S.screen = S.exam.done ? "results" : "quiz"; filter = "all"; writeLocal(); render({top:true}); break;
    case "filter": filter = el.getAttribute("data-f"); render(); break;
  }
});

app.addEventListener("submit", function(ev){ ev.preventDefault(); if(ev.target.id === "authform") doAuth(); });
app.addEventListener("change", function(ev){
  if(ev.target.id !== "impfile" || !ev.target.files || !ev.target.files[0]) return;
  var rd = new FileReader();
  rd.onload = function(){ imp.text = String(rd.result || ""); imp.msg = ""; imp.errors = []; render(); };
  rd.onerror = function(){ imp.msg = "No pude leer ese archivo."; render(); };
  rd.readAsText(ev.target.files[0]);
});
app.addEventListener("input", function(ev){
  if(extraInput(ev)) return;
  if(ev.target.id === "email"){ auth.email = ev.target.value; return; }
  if(ev.target.id === "pass"){ auth.pass = ev.target.value; return; }
  if(ev.target.id !== "ans") return;
  var st = store(), q = stepsOf()[st.idx][0];
  st.answers[q.id] = ev.target.value;
  save(); updateChrome();
});
app.addEventListener("keydown", function(ev){
  if(ev.key === "Enter" && ev.target.id === "ans"){
    ev.preventDefault();
    var st = store();
    if(st.idx < stepsOf().length-1) go(st.idx+1);
  }
  if(ev.key === "Enter" && (ev.target.id === "pin" || ev.target.id === "pin2")){ ev.preventDefault(); pinGo(); }
  if(ev.key === "Escape" && modal){ modal = null; render(); }
});

/* Arranque: primero revisa si este aparato ya tiene sesión, luego sincroniza. */
function syncNow(){
  if(!window.KXSync || !KXSync.enabled || !KXSync.hasSession()) return;
  KXSync.flush();
  reconcile();
}
if(window.KXSync){
  KXSync.init({onStatus:setSyncStatus, onSignedOut:function(){ render(); }}).then(function(){
    render();
    syncNow();
  });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) syncNow(); });
  window.addEventListener("online", syncNow);
  setInterval(function(){ if(!document.hidden) syncNow(); }, 30000);
} else render();

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

/* Utilidad de pruebas (no la usa el niño). */
window.__kx = {EXAM:EXAM, BANK:BANK, C:C, isCorrect:isCorrect, gm:function(){ return gm; }, S:function(){ return S; }};
})();
